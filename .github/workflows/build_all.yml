name: Build+Upload uMCX packages
on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  NVHPC_VERSION: "25.3"
  NVHPC_PKG: nvhpc-25-3

jobs:
  linux_release:
    name: Linux portable binary (nvc)
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Free disk space
        run: |
          # the HPC SDK installs to 17 GB
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Cache HPC SDK with CUDA
        id: cache-hpc
        uses: actions/cache@v4
        with:
          path: /opt/nvidia/hpc_sdk
          key: nvhpc-${{ env.NVHPC_VERSION }}-linux-gpu-slim-v1
      - name: Install HPC SDK (if not cached)
        if: ${{ steps.cache-hpc.outputs.cache-hit != 'true' }}
        run: |
          curl -fsSL https://developer.download.nvidia.com/hpc-sdk/ubuntu/DEB-GPG-KEY-NVIDIA-HPC-SDK \
            | sudo gpg --dearmor -o /usr/share/keyrings/nvidia-hpcsdk-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/nvidia-hpcsdk-archive-keyring.gpg] https://developer.download.nvidia.com/hpc-sdk/ubuntu/amd64 /' \
            | sudo tee /etc/apt/sources.list.d/nvhpc.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ${{ env.NVHPC_PKG }}
          sudo apt-get clean
          # unlike the CPU-only test job, the CUDA toolkit is kept: offloading needs its
          # nvvm, ptxas, fatbinary and nvlink; MPI, math libraries and profilers are dropped
          BASE=/opt/nvidia/hpc_sdk/Linux_x86_64/${{ env.NVHPC_VERSION }}
          sudo rm -rf $BASE/comm_libs $BASE/math_libs $BASE/profilers $BASE/examples $BASE/REDIST
          sudo find $BASE/cuda -maxdepth 2 \( -name 'nsight*' -o -name libnvvp -o -name extras -o -name compute-sanitizer \) -exec rm -rf {} +
          sudo find $BASE/cuda \( -name 'libcublas*' -o -name 'libcufft*' -o -name 'libcusparse*' -o -name 'libcusolver*' \
            -o -name 'libcurand*' -o -name 'libnpp*' -o -name 'libnvjpeg*' -o -name 'libnvblas*' -o -name 'libcufile*' \) -delete
          du -sh /opt/nvidia/hpc_sdk
      - name: Build the manylinux_2_28 release builder
        run: |
          docker build --build-arg WITH_ROCM=0 \
              -t umcx-linux-release-builder .github/linux_release_builder
      - name: Build bin/umcx with nvc++ (manylinux_2_28)
        run: |
          NV=/opt/nvidia/hpc_sdk/Linux_x86_64/${{ env.NVHPC_VERSION }}
          RUN="docker run --rm -v $PWD:/src -v $NV:$NV:ro -e NVHPC_ROOT=$NV -e HOST_UID=$(id -u) -e HOST_GID=$(id -g)"
          # nvc++ reads the gcc paths from bin/localrc: make one for the container's gcc first
          $RUN umcx-linux-release-builder bash .github/linux_release_builder/build_umcx.sh localrc
          $RUN -v $PWD/build/nvhpc_localrc:$NV/compilers/bin/localrc:ro \
              umcx-linux-release-builder bash .github/linux_release_builder/build_umcx.sh nvc
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2022a
      - name: Install Octave
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends octave liboctave-dev
      - name: Build umcxlab for MATLAB and Octave (manylinux_2_28)
        run: |
          # the runner's MATLAB and Octave headers, mounted read-only, as mcxcl does
          MLROOT=$(dirname "$(dirname "$(readlink -f "$(which matlab)")")")
          OCTINC=$(dirname "$(dirname "$(find /usr/include -path '*/octave/mex.h' | head -1)")")
          docker run --rm -v $PWD:/src -v "$MLROOT:$MLROOT:ro" -e MATLAB_ROOT="$MLROOT" \
              -v "$OCTINC:/octinc:ro" -e OCTAVE_INCDIR=/octinc -e HOST_UID=$(id -u) -e HOST_GID=$(id -g) \
              umcx-linux-release-builder bash .github/linux_release_builder/build_umcx.sh mex
          test -f umcxlab/umcx.mexa64 && test -f umcxlab/umcx.mex
          ARCH=$(octave-cli --eval "disp(computer('arch'))")
          mkdir -p umcxlab/octave/$ARCH
          mv umcxlab/umcx.mex umcxlab/octave/$ARCH/
          # it must load: called with no input it does nothing
          octave-cli --eval "addpath('umcxlab'); umcx(); assert(exist('umcx') > 0)"
          ls -lR umcxlab
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-nvc
          path: |
            bin/umcx
            umcxlab/umcx.mexa64
            umcxlab/octave
          if-no-files-found: error

  package:
    name: Package Linux release
    needs: linux_release
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: linux-release-nvc
          path: .
      - name: Create release tag
        run: perl -e "print 'RELEASE_TAG='. lc('${{ runner.os }}-${{ runner.arch }}-github-latest')" >> $GITHUB_ENV
      - name: Test the packaged binary on a stock Ubuntu (no GPU driver)
        run: |
          chmod +x bin/umcx
          ldd bin/umcx
          cd bin
          ./umcx --bench cube60 -n 1e4 -S 0 -d 0 || echo "umcx (nvc) needs the NVIDIA driver to start"
      - name: Zip umcx
        run: |
          mkdir -p packages umcx/test
          cp -a bin README.md LICENSE.txt AUTHORS.md umcxlab umcx/
          cp test/testumcx.sh umcx/test/
          rm -f umcx/bin/*.bnii umcx/bin/*.jdb umcx/umcxlab/*.jdb
          zip -FSr --symlink packages/umcx-${{ env.RELEASE_TAG }}.zip umcx
          unzip -l packages/umcx-${{ env.RELEASE_TAG }}.zip
      - name: Upload umcx package
        uses: actions/upload-artifact@v4
        with:
          name: all-umcx-packages-${{ env.RELEASE_TAG }}
          path: packages/umcx-${{ env.RELEASE_TAG }}.zip

  build_cpu:
    name: ${{ matrix.os }} portable CPU binary
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install dependencies (macos-14 only)
        if: ${{ matrix.os == 'macos-14' }}
        run: brew install gcc@13
      - name: Install dependencies (Windows only)
        if: ${{ runner.os == 'Windows' }}
        run: |
          choco install mingw -y
          echo 'C:\ProgramData\mingw64\mingw64\bin' >> $GITHUB_PATH
      - name: Build binary with the GCC runtime linked statically
        run: |
          cd src
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            CXX=g++-14; [[ "${{ matrix.os }}" == "macos-14" ]] && CXX=g++-13
            # no -Bstatic on macOS: put libgomp.a ahead of the -lgomp that -fopenmp adds, and
            # drop the Homebrew dylibs that are then unused
            make CXX=$CXX USERLINKFLAGS="-static-libgcc -static-libstdc++ $($CXX -print-file-name=libgomp.a) -Wl,-dead_strip_dylibs"
            strip ../bin/umcx
            otool -L ../bin/umcx
            # only the system libraries may remain
            if otool -L ../bin/umcx | tail -n +2 | grep -vE '^\s+/usr/lib/|^\s+/System/'; then
              echo "umcx links a non-system library"; exit 1
            fi
          else
            # -static also links libgomp and winpthread, besides libgcc and libstdc++
            make USERLINKFLAGS="-static"
            strip ../bin/umcx.exe
            objdump -p ../bin/umcx.exe | grep "DLL Name:"
            if objdump -p ../bin/umcx.exe | grep "DLL Name:" | grep -iE 'libgomp|libwinpthread|libstdc|libgcc'; then
              echo "umcx.exe links a GCC runtime DLL"; exit 1
            fi
          fi
      - name: Install Octave (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: brew install octave
      - name: Install Octave 10.3 (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: |
          curl --retry 3 -kL https://ftpmirror.gnu.org/octave/windows/octave-10.3.0-w64.7z --output octave_10.3.7z
          7z x octave_10.3.7z -ooctave -y > /dev/null
          rm -f octave_10.3.7z
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          # the first release with a native Apple-silicon MATLAB
          release: ${{ runner.os == 'macOS' && 'R2023b' || 'R2022a' }}
      - name: Build umcxlab for MATLAB and Octave
        run: |
          cd src
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            CXX=g++-14; [[ "${{ matrix.os }}" == "macos-14" ]] && CXX=g++-13
            GOMP=$($CXX -print-file-name=libgomp.a)
            # link the Octave mex without a path to liboctmex: -loctmex finds this empty stub,
            # which is dead-stripped, so the mex API resolves in the liboctmex of the running
            # Octave, any 10+ version (from mcxcl)
            mkdir -p octstub && echo "" | clang -dynamiclib -x c - -o "$PWD/octstub/liboctmex.dylib" -install_name @rpath/liboctmex-stub.dylib
            make oct CXX=$CXX MEXLINKOPT="-static-libgcc -static-libstdc++ $GOMP -L$PWD/octstub -Wl,-dead_strip_dylibs"
            # without mex's own C++ flags, which are clang's (-fobjc-arc) and g++ rejects; mex
            # links with its Xcode clang++ setup, which leaves out g++'s libstdc++: named here
            make mex CXX=$CXX MEXBASEFLAGS= MEXLINKOPT="-static-libgcc $($CXX -print-file-name=libstdc++.a) $GOMP -Wl,-dead_strip_dylibs"
            rm -rf octstub
            for f in ../umcxlab/umcx.mex*; do
              otool -L $f
              # only the system's libraries and MATLAB's own may remain
              if otool -L $f | tail -n +2 | grep -vE '^\s+/usr/lib/|^\s+/System/|@rpath/lib(mx|mex|mat)\.dylib'; then
                echo "$f links a library of the build machine"; exit 1
              fi
            done
            OCTCLI=octave-cli
          else
            # Octave's mex with Octave's own gcc, matching its MinGW headers; MATLAB's with the
            # MinGW gcc of the binary, through mexopts_msys2_gcc.xml (both as mcxcl does)
            OCT="$GITHUB_WORKSPACE/octave/octave-10.3.0-w64/mingw64"
            PATH="$OCT/bin:$PATH" make oct CXX=g++ MEXLINKOPT="-static-libgcc -static-libstdc++"
            strip ../umcxlab/umcx.mex
            # mex.bat called from here, not through make: there "cmd //c mex.bat" only opened
            # an empty prompt; bash runs a .bat through cmd itself, quoting each argument.
            # COMPFLAGS and DEFINES, which the mexopts file builds CXXFLAGS from, are given
            # empty and MATLAB_MEX_FILE is defined in CXXFLAGS, as mcxcl's Makefile does
            MW_MINGW64_LOC='C:\ProgramData\mingw64\mingw64' mex.bat -f mexopts_msys2_gcc.xml \
                'CXXFLAGS=$CXXFLAGS -DMATLAB_MEX_FILE -std=c++11 -O3 -fopenmp' 'LDFLAGS=$LDFLAGS -fopenmp -static' \
                'COMPFLAGS=' 'DEFINES=' \
                umcx.cpp -outdir ../umcxlab
            for f in ../umcxlab/umcx.mex*; do objdump -p $f | grep "DLL Name:"; done
            OCTCLI="$OCT/bin/octave-cli"
          fi
          rm -f umcx.o
          cd ..
          # both mex files must be there: a build that printed nothing may have made neither
          n=$(ls umcxlab | grep -cE '^umcx\.mex(a64|w64|maci64|maca64)?$' || true)
          [ "$n" = 2 ] || { ls -la umcxlab; echo "a mex file is missing"; exit 1; }
          ARCH=$("$OCTCLI" --eval "disp(regexprep(computer('arch'), 'darwin[0-9.]+-', 'darwin-'))" | tr -d '\r')
          mkdir -p umcxlab/octave/$ARCH
          mv umcxlab/umcx.mex umcxlab/octave/$ARCH/
          # it must load: called with no input it does nothing
          "$OCTCLI" --eval "addpath('umcxlab'); umcx(); assert(exist('umcx') > 0)"
          ls -lR umcxlab
      - name: Run benchmarks and tests
        run: |
          cd bin
          ./umcx --bench cube60 -n 1e6 -S 0 -d 0
          ./umcx --bench cube60b -n 1e6 -S 0
          cd ../test
          ./testumcx.sh
      - name: Create release tag
        run: perl -e "print 'RELEASE_TAG='. lc('${{ runner.os }}-${{ runner.arch }}-github-latest')" >> $GITHUB_ENV
      - name: Zip umcx
        run: |
          mkdir -p packages umcx/bin umcx/test
          cp bin/umcx* umcx/bin/
          cp -a README.md LICENSE.txt AUTHORS.md umcxlab umcx/
          rm -f umcx/umcxlab/*.jdb
          cp test/testumcx.sh umcx/test/
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a -tzip packages/umcx-${{ env.RELEASE_TAG }}.zip umcx
          else
            zip -FSr --symlink packages/umcx-${{ env.RELEASE_TAG }}.zip umcx
          fi
      - name: Upload umcx package
        uses: actions/upload-artifact@v4
        with:
          name: all-umcx-packages-${{ env.RELEASE_TAG }}
          path: packages/umcx-${{ env.RELEASE_TAG }}.zip

  upload_package:
    name: Upload Packages
    needs: [package, build_cpu]
    runs-on: ubuntu-22.04
    if: ${{ !cancelled() && needs.package.result == 'success' && needs.build_cpu.result == 'success' && github.repository_owner == 'fangq' && github.actor == 'fangq' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    steps:
      - name: Download umcx
        uses: actions/download-artifact@v4
        with:
          pattern: all-umcx-packages-*
          merge-multiple: true
          path: packages
      - name: Display structure of downloaded files
        run: ls -R packages
      - name: Copy package to server
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.MCX_SERVER }}
          username: ${{ secrets.MCX_SERVER_USER }}
          ssh_private_key: ${{ secrets.MCX_SERVER_SSH_KEY }}
          local_path: "packages/*"
          remote_path: ${{ secrets.MCX_CI_PATH }}
